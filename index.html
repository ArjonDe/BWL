<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BWL-Klausurtrainer</title>
  <meta name="description" content="Interaktive Lernplattform für Einführung in die BWL – Quiz, Karteikarten, Prüfungsmodus, Glossar, Spaced Repetition.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%234f46e5'/%3E%3Cpath d='M18 44V20h8l6 14 6-14h8v24h-6V30l-6 14h-4l-6-14v14z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=1.0.0">
  <script>
    /* Theme vor dem ersten Paint setzen, um Flackern zu vermeiden */
    (function () {
      try {
        var t = localStorage.getItem('lp.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Zum Inhalt springen</a>

  <header class="topbar">
    <button class="icon-btn only-mobile" id="navToggle" aria-label="Navigation öffnen" aria-expanded="false">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <a class="brand" href="#/">
      <span class="brand-logo" aria-hidden="true">K</span>
      <span class="brand-text">Klausurtrainer</span>
    </a>
    <div class="subject-switch" role="tablist" aria-label="Fach wählen" id="subjectSwitch"></div>
    <div class="topbar-right">
      <span class="streak" id="streakBadge" title="Lerntage in Folge">🔥 0</span>
      <button class="icon-btn" id="themeToggle" aria-label="Hell-/Dunkelmodus umschalten">
        <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="sidebar" aria-label="Hauptnavigation">
      <ul class="nav" id="nav"></ul>
      <div class="sidebar-foot">
        <p class="muted small">Alle Inhalte stammen ausschließlich aus den Vorlesungsunterlagen. Fortschritt wird lokal im Browser gespeichert.</p>
      </div>
    </nav>
    <div class="scrim" id="scrim" hidden></div>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <div class="toast-host" id="toastHost" aria-live="polite"></div>

  <!-- Kern -->
  <script src="util.js?v=1.0.0"></script>
  <script src="store.js?v=1.0.0"></script>
  <script src="srs.js?v=1.0.0"></script>
  <script src="quizengine.js?v=1.0.0"></script>
  <!-- Inhalte (ausschließlich aus den Unterlagen) -->
  <script src="bwl.js?v=1.0.0"></script>
  <script src="bwl-questions.js?v=1.0.0"></script>
  <!-- Ansichten -->
  <script src="dashboard.js?v=1.0.0"></script>
  <script src="learn.js?v=1.0.0"></script>
  <script src="quiz.js?v=1.0.0"></script>
  <script src="cards.js?v=1.0.0"></script>
  <script src="exam.js?v=1.0.0"></script>
  <script src="stats.js?v=1.0.0"></script>
  <script src="glossary.js?v=1.0.0"></script>
  <script src="tools.js?v=1.0.0"></script>
  <script src="settings.js?v=1.0.0"></script>
  <!-- App-Start -->
  <script src="app.js?v=1.0.0"></script>
</body>
</html>
